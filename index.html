<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: without windowSoftInputMode="adjustResize" set natively
         (this app doesn't, and changing that needs a new APK build, not just a web deploy), the
         on-screen keyboard would otherwise just draw on top of the page without the WebView's
         layout viewport ever shrinking — so vh/dvh units and `fixed`-positioned bottom sheets have
         no way to know the visible area got smaller, and content near the bottom (e.g. a modal's
         Save button) can end up hidden behind the keyboard with no way to scroll to it. This meta
         value (Chrome/WebView 108+) achieves the same effect purely at the web layer: the layout
         viewport itself shrinks when the keyboard opens, so `85vh`-capped modals and `fixed
         inset-0` overlays resize correctly without any native change. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="FamilyLedger">
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>FamilyLedger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (media=print swaps to all once downloaded). Icons are names written as text until the icon
         font arrives, so they stay invisible until then (or 3 s at most) rather than flashing as words. -->
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800;900&amp;display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" />
    <style>
      html:not(.fl-icons-ready) .material-symbols-outlined { visibility: hidden; }
      body { margin: 0; background: #F6F8FA; }
      #fl-splash { height: 100vh; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      #fl-splash .fl-name { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; color: #0F172A; }
      #fl-splash .fl-name b { color: #0284C7; font-weight: 900; }
      #fl-splash .fl-bar { position: relative; width: 150px; height: 5px; border-radius: 9px; background: #e2e8f0; overflow: hidden; }
      #fl-splash .fl-bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 40%; border-radius: 9px; background: linear-gradient(90deg, #4ADE80, #3B82F6); animation: flsplash 1.3s ease-in-out infinite; }
      @keyframes flsplash { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    </style>
    <script>
      // Counts "the app was opened" the moment the page starts, before the app code has downloaded, so people who give up during the
      // load show up in the admin funnel. Same anonymous counter and same consent rules as src/lib/funnel.ts: no id is sent, never on iPhone,
      // on by default only in the Android app outside Europe, otherwise only after a yes.
      (function () {
        try {
          var cap = window.Capacitor, plat = cap && cap.getPlatform ? cap.getPlatform() : 'web';
          if (plat === 'ios') return;
          var stored = localStorage.getItem('familyledger_analytics_consent'), ok = stored === 'granted';
          if (!stored) {
            var tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '');
            ok = !(tz.indexOf('Europe/') === 0 || tz === 'Atlantic/Reykjavik' || tz === 'Atlantic/Azores' || tz === 'Atlantic/Madeira' || tz === 'Atlantic/Canary');
          }
          if (!ok) return;
          var seg = localStorage.getItem('fl_first_signin_at') ? 'ret' : 'new';
          // First open of the day on this phone/browser (same local flag funnel.ts uses), so the server can keep a devices count too.
          var first = false;
          try {
            var day = new Date(Date.now() + 5.5 * 3600000).toISOString().slice(0, 10);
            var raw = localStorage.getItem('fl_funnel_seen'), saved = raw ? JSON.parse(raw) : null;
            var seen = saved && saved.day === day && Array.isArray(saved.seen) ? saved.seen : [];
            if (seen.indexOf('app_open') < 0) { first = true; localStorage.setItem('fl_funnel_seen', JSON.stringify({ day: day, seen: seen.concat(['app_open']) })); }
          } catch (e2) {}
          fetch('/api/funnel', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ event: 'app_open', seg: seg, first: first || undefined }), keepalive: true }).catch(function () {});
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        var root = document.documentElement;
        function ready() { root.classList.add('fl-icons-ready'); }
        setTimeout(ready, 3000);
        if (document.fonts && document.fonts.load) {
          document.fonts.load('24px "Material Symbols Outlined"', 'home').then(ready, ready);
        }
      })();
    </script>
    <script>
      // Suppress benign background Vite HMR or WebSocket connection failures in AI Studio environment
      (function() {
        // Hide Vite Error/HMR Overlay
        const style = document.createElement('style');
        style.innerHTML = 'vite-error-overlay, #vite-error-overlay, [id^="vite-error-"] { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }';
        document.head.appendChild(style);

        const isHmrError = function(err) {
          if (!err) return false;
          const msg = (err.message || String(err) || '').toLowerCase();
          return (
            msg.includes('websocket') || 
            msg.includes('vite') || 
            msg.includes('hmr') || 
            msg.includes('closed without opened') || 
            msg.includes('connection lost')
          );
        };

        window.addEventListener('unhandledrejection', function(event) {
          if (isHmrError(event.reason) || isHmrError(event.detail)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isHmrError(event.message) || isHmrError(event.error)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // Safely patch WebSocket constructor to prevent uncaught network exceptions
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          const PatchedWebSocket = function(url, protocols) {
            const isViteHmr = typeof url === 'string' && (
              url.includes('vite') || 
              url.includes('hmr') || 
              url.includes('/@vite/') || 
              url.includes('localhost') || 
              url.includes('127.0.0.1')
            );
            
            let ws;
            try {
              if (protocols) {
                ws = new OriginalWebSocket(url, protocols);
              } else {
                ws = new OriginalWebSocket(url);
              }
            } catch (e) {
              if (isViteHmr) {
                console.warn('[Vite WebSocket Mock] Failed to create socket:', e.message);
              }
              throw e;
            }

            if (isViteHmr && ws) {
              ws.addEventListener('error', function(e) {
                e.stopImmediatePropagation();
                e.preventDefault();
              }, { capture: true });
            }
            return ws;
          };

          PatchedWebSocket.prototype = OriginalWebSocket.prototype;
          for (const key in OriginalWebSocket) {
            if (Object.prototype.hasOwnProperty.call(OriginalWebSocket, key)) {
              PatchedWebSocket[key] = OriginalWebSocket[key];
            }
          }
          window.WebSocket = PatchedWebSocket;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"><div id="fl-splash"><svg width="84" height="84" viewBox="0 0 100 120" fill="none" aria-hidden="true"><defs><linearGradient id="g" x1="10" y1="10" x2="90" y2="110" gradientUnits="userSpaceOnUse"><stop stop-color="#4ADE80"/><stop offset="1" stop-color="#3B82F6"/></linearGradient></defs><rect x="10" y="10" width="80" height="100" rx="14" fill="url(#g)"/><path d="M70 40C70 36.7 72.7 34 76 34H90V86H76C72.7 86 70 83.3 70 80V40Z" fill="#1E3A8A"/><circle cx="35" cy="40" r="8" fill="#fff" fill-opacity=".9"/><path d="M25 50a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v25H25z" fill="#fff" fill-opacity=".9"/><circle cx="55" cy="45" r="7" fill="#fff" fill-opacity=".8"/><path d="M48 52a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v23H48z" fill="#fff" fill-opacity=".8"/><circle cx="45" cy="70" r="5" fill="#fff"/><circle cx="65" cy="72" r="5" fill="#fff"/></svg><div class="fl-name">Family<b>Ledger</b></div><div class="fl-bar"><i></i></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
